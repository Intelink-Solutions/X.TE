<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0710" />
    <meta
      name="description"
      content="The official home of X'Touch Entertainment: television, music, production, dancers, live streaming, events and news."
    />
    <meta name="author" content="X'Touch Entertainment" />
    <meta property="og:title" content="X'Touch Entertainment" />
    <meta
      property="og:description"
      content="Television, music, production, live events and social media in one premium platform."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xtouchentertainments.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://xtouchentertainments.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/logo-icon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      #xtouch-boot-splash { display: none; }
      @media (max-width: 767px) {
        #xtouch-boot-splash {
          position: fixed; inset: 0; z-index: 100; display: flex; align-items: center;
          justify-content: center; background: #0d0710; color: #e5ad43;
        }
        #xtouch-boot-splash img {
          width: 80px; height: 80px; border-radius: 24px; object-fit: cover;
          animation: xtouch-boot-pop 360ms cubic-bezier(.22,1,.36,1) both;
        }
        #xtouch-boot-splash span {
          display: block; margin-top: 18px; text-align: center; font: 800 17px/1.2 sans-serif;
          letter-spacing: .28em; text-transform: uppercase;
        }
      }
      @keyframes xtouch-boot-pop { from { opacity: 0; transform: scale(.84) } to { opacity: 1; transform: scale(1) } }
    </style>
    <title>X'Touch Entertainment — TV, Music, Production & Live</title>
  </head>
  <body>
    <div id="root">
      <div id="xtouch-boot-splash" role="status" aria-label="Loading X'Touch Entertainment">
        <div><img src="/logo-icon.png" alt="" width="80" height="80" /><span>X'Touch</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
